# crux/catalog/models.yml — the single resolution table for agent models.
# Hand-authored. Validated by validate-catalog.py. NEVER regenerated.
# schema_version is read by models_catalog.load(), which refuses any value it
# does not recognize (rule V0). It is not decoration.
schema_version: "4"

# Table 1 — providers: the allowlist for the provider half of an alias value.
# Adding a provider is a deliberate one-line edit, reviewed like any other.
providers:
  - openrouter

# Table 2 — aliases: short name -> provider/model-id. THE ONLY PLACE in this
# file where an OpenCode model id appears. An alias that no cell references is
# a PARKED ALTERNATE: legal, silent, and deliberate. Do not add a reachability
# check — alternating between two models in one cell is why this table exists.
#
# Every value has the form `openrouter/<vendor>/<upstream-slug>`. The providers
# table above holds one entry, so the provider half is always `openrouter`, and
# the part AFTER it is the upstream slug pinned VERBATIM — never normalized,
# never a redirect. Distinctness between two values reads the vendor namespace
# (the first segment after `openrouter/`), not the shared provider half.
#
# PROVENANCE. The eight slugs below were read 2026-08-26 from the OpenRouter
# models endpoint, https://openrouter.ai/api/v1/models, and are spelled as that
# response spells them. Two spellings a reader would otherwise guess wrong:
# Haiku is served as `claude-haiku-4.5`, NOT the dated
# `claude-haiku-4-5-20251001` this table carried before, and Anthropic point
# releases use a DOT (`claude-opus-4.8`) where the previous provider used a
# hyphen. Never derive one row's slug from a neighbouring row's shape — read
# the endpoint. See ADR-0072 §3 for why the alias table is the only place a
# model id may appear.
# `sonnet-latest` was re-read 2026-09-28 from https://openrouter.ai/api/v1/models.
# `sol-latest` was re-read 2026-09-29 from the same endpoint: `openai/gpt-6.1-sol`,
# canonical slug `openai/gpt-6.1-sol-20260929`.
# `kimi-latest` was read 2026-11-05 from https://openrouter.ai/api/v1/models:
# `moonshotai/kimi-k3.1-pro`, canonical slug `moonshotai/kimi-k3.1-pro-20261023`.
# The alias pins that id, never the moving `~moonshotai/kimi-latest` router.
aliases:
  fable-latest: openrouter/anthropic/claude-fable-5.1
  opus-latest: openrouter/anthropic/claude-opus-5.5
  sonnet-latest: openrouter/anthropic/claude-sonnet-5.5
  haiku-latest: openrouter/anthropic/claude-haiku-5.5
  sol-latest: openrouter/openai/gpt-6.1-sol
  qwen-max: openrouter/qwen/qwen3.8-2.4t-a95b
  deepseek-flash: openrouter/deepseek/deepseek-v4.1-flash-1017
  kimi-latest: openrouter/moonshotai/kimi-k3.1-pro

  # The separator asymmetry in the GLM pair is UPSTREAM'S and not a typo here:
  # the base SKU is `glm-5.3` (dot) and the fast SKU is `glm-5.3-flash` (hyphen
  # before `flash`). Verbatim upstream slugs, as the header requires — never
  # "fix" a perceived typo against the gateway's own spelling, and never derive
  # one row's shape from a neighbouring row. The flash SKU remains a parked
  # alternate for developer tasks.
  glm-latest: openrouter/z-ai/glm-5.3
  glm-flash: openrouter/z-ai/glm-5.3-flash

# Table 3 — roster: agent role -> level. A value is either a level name or a
# mapping {level, claude, opencode, codex, authority}. `claude` overrides the
# Claude Code column and must be a Table 5 member; the agent file's `model:`
# then equals it (rule V6). `opencode` overrides the OpenCode column. `codex`
# replaces the level's Codex runtime as a whole: an override carries model,
# reasoning_effort, verified and source, and a partial override is refused
# (rule V0), never merged with the level's cell. Each override leaves the
# other columns resolving from the level. The KEY SET is in bijection with the
# stems of crux/agents/*.md.
#
# CODEX PROVENANCE (ADR-0170). A Codex slug, in a level cell or an override,
# validates against its recorded Codex-catalog provenance, not the router
# registry (rule V5). Its `source` cites `Codex <x.y.z> models_cache.json` and
# names the slug backtick-quoted, as the cited catalog listed it.
#
# AUTHORITY (ADR-0170). A dated owner instruction recorded beside an override
# authorizes it. `authority` holds one entry per overridden column, exactly
# the overridden set (rule V10). An entry carries `instruction` (the owner's
# words, or an owner commit's subject verbatim with its hash), `date` (a
# quoted "YYYY-MM-DD", the date of the source that set the current value) and
# an optional `decision` (an ADR-NNNN/<slug> handle). An unquoted ISO date
# is normalised to the same text on both parse paths, so quoting is
# convention; an unquoted date that names no real day is refused. A role's
# tier is its level. A move within the agent's tier is configuration and needs only the
# instruction. A move to a model of another tier needs an Accepted ADR, named
# in `decision`. V10 refuses a decision that names ADR-0170 itself, and one
# this repository's resolver does not list as Accepted. Review checks that
# the cited decision authorizes this move.
#
# TIER. The tier set of an override is the set of levels whose cell in the
# SAME column names the same value: the Claude value for `claude`, the alias
# for `opencode`, `codex.model` for `codex`. A model is never matched across
# columns, so `opus-latest` in the OpenCode column is apex only. An override
# is same-tier when the agent's level is in its tier set. It is cross-tier
# when the set is non-empty and lacks that level, and of undeterminable tier
# when no level names the value. Editing an agent's `level:` re-runs the
# inference. Six overrides predate the rule: validate-catalog.py lists each
# as an exact (agent, level, column, value) tuple and warns on it until the
# owner settles it with an ADR, a same-tier value or a revert.
#
# LIMITS. V10 does not check three kinds of move. A move made by editing a
# level cell is invisible to a static check; review covers it. A move made by
# editing what an alias resolves to in Table 2 is not checked. A change of
# reasoning effort is runtime, not tier. V10 compares `date` with the run's
# UTC date, so an owner whose local date is ahead of UTC may be refused for
# some hours.
agents:
  architect:
    level: flagship
    opencode: opus-latest
    authority:
      opencode:
        instruction: "Owner commit 1ca140cc9: 'Pin flagship to Opus 5.5 and re-point OpenCode models'"
        date: "2026-10-09"
  brainstormer: flagship
  commander:
    level: apex
    claude: claude-opus-5-5
    opencode: kimi-latest
    authority:
      claude:
        instruction: "Claude Code override to Opus 5.5, from the 2026-09-22 trial. Opus met every acceptance criterion for the commander at 55% lower cost per call. The record is the PB-0116 trial report in the crux development repository (2026-09-22). Owner commit d653cdd66."
        date: "2026-09-22"
      opencode:
        instruction: "OpenCode overrides to Kimi K3.1 Pro by owner instruction, 2026-11-05, replacing Gemini 4 Argon, which errored. Owner commit 9339b4081."
        date: "2026-11-05"
  dev-lead:
    level: flagship
    opencode: glm-latest
    authority:
      opencode:
        instruction: "OpenCode overrides to GLM 5.3 by owner instruction, 2026-10-28, for a faster model. Owner commit afe43365f."
        date: "2026-10-28"
  developer:
    level: standard
    opencode: deepseek-flash
    authority:
      opencode:
        instruction: "Owner commit 47c1e4c6e: 'Point the developer agent at deepseek-flash and re-anchor two fixtures'"
        date: "2026-09-18"
  historian: standard
  librarian: standard
  # night-gardener: runs at apex by owner instruction, 2026-09-22, so it
  # resolves to Opus 5.5 on Claude Code with no override. Untrialled: the
  # trial above had no night-gardener arm.
  night-gardener:
    level: apex
  # reviewer: Claude inherits the apex cell, pinned to Opus 5.5.
  reviewer:
    level: apex
    opencode: kimi-latest
    codex:
      model: gpt-6.1-sol
      reasoning_effort: xhigh
      verified: "2026-09-29"
      source: "OpenAI GPT-6.1 Sol model documentation and Codex 0.159.0 models_cache.json checked 2026-09-29, which lists `gpt-6.1-sol`"
    authority:
      opencode:
        instruction: "OpenCode overrides to Kimi K3.1 Pro by owner instruction, 2026-11-05, replacing Gemini 4 Argon, which errored. Owner commit 9339b4081."
        date: "2026-11-05"
      codex:
        instruction: "Codex override re-pointed from GPT-5.6 Sol to its successor, GPT-6 Sol, by owner instruction, 2026-09-22. Effort stays xhigh. (7dcb4c1a5^:crux/catalog/models.yml:89-90.) Re-pointed to GPT-6.1 Sol by owner commit ca16b8921: 'Move every GPT-6 Sol assignment to GPT-6.1 Sol'"
        date: "2026-09-29"
  wayfinder: standard

# Table 4 — level -> per-harness resolution. `opencode` is optional; a level
# that omits it forces every agent at that level to name its own (rule V2).
#
# Apex selects Astra on Codex and flagship selects Sol. Standard selects Terra
# by owner instruction, 2026-10-26. All three use high effort. Flagship and
# standard stay two rungs: their Claude and OpenCode cells differ, and rule V8 compares the whole
# tuple. Apex sets an OpenCode default of `opus-latest`; an apex agent that
# names its own alias overrides it.
#
# `source` records where a Codex pair was READ FROM. `verified` records the
# date the pair was last checked against that source — rule V4 warns past 180
# days — so the two fields answer different questions and neither is decoration.
#
# Astra and its high effort setting were re-verified 2026-09-22 against the
# local Codex 0.155.1 models_cache.json, fetched that day. The exact slug is
# `gpt-6-astra`. Codex availability does not establish OpenRouter availability.
#
# PROVENANCE for Sol. The slug is an external contract owned by OpenAI. It was
# verified 2026-09-29 against two sources. (1) The official model page:
#   https://developers.openai.com/api/docs/models/gpt-6.1-sol
# which lists the efforts low, medium (the default), high, xhigh and max, and
# neither none nor minimal. (2) The local codex-cli 0.159.0 catalog, fetched
# 2026-09-29, which lists `gpt-6.1-sol` with the efforts low, medium, high,
# xhigh, max, ultra. Bare `gpt-6.1` is not a Codex slug, so the concrete slug is
# pinned here. The GPT-6 Sol slug `gpt-6-sol` is retired from this file and from
# the router registry.
#
# PROVENANCE for Terra. Verified 2026-10-26 against two sources. (1) The
# official model page:
#   https://developers.openai.com/api/docs/models/gpt-6.1-terra
# which lists the efforts none, low, medium (the default), high, xhigh and max.
# (2) The local codex-cli 0.164.0 catalog, fetched 2026-10-26, which lists
# `gpt-6.1-terra` with the efforts low, medium, high, xhigh, max, ultra and
# the default low. The sources disagree on both ends and the default; both
# list high.
#
# The reviewer is an approved per-agent exception. Its complete Codex runtime
# block cites the official GPT-6.1 Sol model documentation and the Codex 0.159.0
# catalog, both checked 2026-09-29. Both list `xhigh` as a supported reasoning
# effort for `gpt-6.1-sol`.
levels:
  apex:
    claude: claude-opus-5-5
    opencode: opus-latest
    codex:
      model: gpt-6-astra
      reasoning_effort: high
      verified: "2026-09-22"
      source: "Codex 0.155.1 models_cache.json fetched 2026-09-22, which lists `gpt-6-astra`"
  flagship:
    claude: claude-opus-5-5
    opencode: sol-latest
    codex:
      model: gpt-6.1-sol
      reasoning_effort: high
      verified: "2026-09-29"
      source: "OpenAI GPT-6.1 Sol model documentation + Codex 0.159.0 models_cache.json fetched 2026-09-29, which lists `gpt-6.1-sol`"
  standard:
    claude: claude-sonnet-5-5
    opencode: glm-latest
    codex:
      model: gpt-6.1-terra
      reasoning_effort: high
      verified: "2026-10-26"
      source: "OpenAI GPT-6.1 Terra model documentation + Codex 0.164.0 models_cache.json fetched 2026-10-26, which lists `gpt-6.1-terra`"

# Table 5 — legal values for the `model:` key in crux/agents/*.md frontmatter,
# and for every Claude cell above: a level's `claude` and an agent's `claude`
# override. An ENUM, not a mapping: membership is the repo's accepted set,
# pinned by rule V0. Reachability does not apply — `haiku` and `inherit` are
# permitted values no cell names, and that is what a permitted value is.
#
# The enum holds family aliases and full model IDs. An assignment that needs
# one model version names its full ID: a family alias never selects a
# version. The `opus` alias resolves to Opus 4.6 on Microsoft Foundry. The
# `sonnet` alias resolves to Sonnet 5.5 only on the Anthropic API. It
# resolves to Sonnet 4.6 on Claude Platform on AWS, and to Sonnet 4.5 on
# Amazon Bedrock, Google Cloud's Agent Platform and Microsoft Foundry. The
# full ID `claude-opus-5-5` needs Claude Code v2.1.280 or later, and
# `claude-sonnet-5-5` needs v2.1.284 or later. Source for both alias
# resolutions and both version floors:
# https://code.claude.com/docs/en/model-config, fetched 2026-09-28. A family
# alias in an agent's `model:` also resolves to the main conversation's model
# when that model is in the family. Source:
# https://code.claude.com/docs/en/sub-agents, fetched 2026-09-28. The full
# IDs are the Claude Code spelling; the router registry names the same models
# `claude-opus-5.5` and `claude-sonnet-5.5`.
claude_aliases:
  - fable
  - opus
  - sonnet
  - haiku
  - inherit
  - claude-opus-5-5
  - claude-sonnet-5-5
