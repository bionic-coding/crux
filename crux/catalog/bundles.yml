# crux/catalog/bundles.yml — the bundle organization of the skill catalog.
# Hand-authored. Validated by validate-catalog.py against the regenerated
# skills.json. NEVER regenerated. The `.yml` extension declares that: in
# crux/catalog/, `.json` means machine-regenerated and `.yml` means
# hand-authored (see the repo-root AGENTS.md catalog-provenance paragraph).
#
# Keyed by bundle id: the mapping key IS the `id`, so it is not repeated in
# the value. `skills:` must list every skill whose SKILL.md frontmatter names
# this bundle, and only skills that exist — the audit checks both directions.
crux-core:
  name: "crux core orchestration substrate"
  description: "Single-gateway LLM caller, self-resolving dissent engine, semantic bridge, tracer, identity, task planner, runbook generator, capability-gap forge loop, retrospective harvest, nightly gardening, and Perplexity-backed news reading. The substrate everything else composes on top of."
  audiences:
    - "agent-team-operators"
    - "software-project-maintainers"
  default_provision: false
  skills:
    - "agent-identity"
    - "call-llm"
    - "forge-skill"
    - "retrospective"
    - "tend-garden"
    - "read-news"
    - "author-runbook"
    - "semantic-bridge"
    - "srde"
    - "task-planner"
    - "trace-runtime-ops"
crux-docs:
  name: "crux documentation suite"
  description: "Skills for project documentation across seven concerns (code, research, ADRs, briefs, journal, promptbooks, invariants) plus the derived arch spine (the current-state architecture surface, built by `derive-arch`), the `dev-cycle` workflow (plan/develop/review for net-new work) and its non-architectural counterpart `iterate` (verify/develop/review for bug fixes, drift, and refinements — no ADR), and the `cleanup-campsite` hygiene scan. Carries the gate skills the default-on workflows depend on — the multi-model `council`, its `run-adr-council` runner, `forge-skill`, `retrospective`, and the LLM/tracing substrate (`call-llm`, `srde`, `trace-runtime-ops`) — so the bundle-closure rule holds. Default-on for any installed crux plugin."
  audiences:
    - "software-project-maintainers"
  default_provision: true
  skills:
    - "archive-promptbook"
    - "audit-docs"
    - "author-promptbook"
    - "backfill-signoff"
    - "call-llm"
    - "check-drift"
    - "cleanup-campsite"
    - "compile-doctrine"
    - "council"
    - "derive-arch"
    - "dev-cycle"
    - "escalate-arch-runtime"
    - "extract-code-docs"
    - "fix-directly"
    - "forge-skill"
    - "ingest-research"
    - "init-docs"
    - "install-codex-agents"
    - "install-docs-skills"
    - "install-opencode-agents"
    - "iterate"
    - "link-adr-graph"
    - "log-work"
    - "migrate-promptbooks"
    - "patch-cycle"
    - "process-inbox"
    - "propose-adr"
    - "propose-brief"
    - "propose-observation"
    - "query-docs"
    - "reconcile-signoff"
    - "recover-decisions"
    - "recover-invariants"
    - "refresh-research-sources"
    - "refresh-research-synthesis"
    - "retrospective"
    - "review-decisions"
    - "run-adr-council"
    - "run-promptbook"
    - "srde"
    - "survey-sheet"
    - "survey-signoff"
    - "trace-runtime-ops"
    - "transition-adr"
    - "transition-brief"
    - "transition-decision"
    - "transition-invariant"
    - "transition-observation"
    - "verify-code-docs"
    - "visualize-run-progress"
    - "whiteboarding"
crux-infrastructure:
  name: "crux infrastructure & lifecycle"
  description: "Spawn crux into a target repo (copies tools + writes the prime directive doc) and FastAPI HTTP server wrapping the LLM router + tracer for non-Python clients. Note: key bootstrap is owned by crux-env, not by any setup skill."
  audiences:
    - "software-project-maintainers"
    - "agent-team-operators"
  default_provision: false
  skills:
    - "serve-llm"
    - "install-runtime"
    - "install-codex-agents"
    - "install-opencode-agents"
crux-verification:
  name: "crux verification primitives"
  description: "Multi-model council deliberation. The anti-hallucination floor that other crux skills compose on top of, plus a parameterized ADR council runner and a prose reviewer that returns rewrites rather than opinions."
  audiences:
    - "software-project-maintainers"
    - "agent-team-operators"
  default_provision: false
  skills:
    - "council"
    - "prose-review"
    - "run-adr-council"
