# Harness control: Swift-package-only inputs, with no Xcode project,
# workspace or generator manifest. The schema is in the module docstring of
# xcode_fixture_harness.py. The control exercises the harness's materialize
# machinery with a dangling symlink. The Swift walk lists files by name, not
# by file type, so the pack declares it as an input; the shared reader
# refuses the link, and the data-model, api-surface and module-graph concerns
# each name it once in their Omissions section as
# `not-a-file (symbolic-link)`. No `parse-error` bullet renders for it. The
# derive neither hangs nor crashes. A FIFO among the walked inputs is an
# environment failure under ADR-0181 (exit 2), so the control no longer
# carries one; fixture 36 holds the FIFO case.
materialize:
  - path: Sources/Core/Link.swift
    kind: symlink
    target: ../../nowhere/Missing.swift

exit_code: 0

rows:
  module-graph:
    - "| `Core` | `Package.swift` | library"
  data-model:
    - "| `Widget` | struct | public |"

omissions:
  - path: Sources/Core/Link.swift
    reason: not-a-file
    kind: symbolic-link
    count: 3

absent:
  data-model:
    - "| `Link`"
    - "`parse-error` `Sources/Core/Link.swift`"
