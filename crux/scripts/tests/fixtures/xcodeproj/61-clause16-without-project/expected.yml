# ADR-0130 clause 16 postcondition (item 1): the "without" member carries
# the identical Swift source and the same qualifying XcodeGen project.yml,
# but no companion Xcode project -- module-graph renders the
# `absent (missing-input)` omission and api-surface's @main owner cell renders the dash.
exit_code: 0

rows:
  api-surface:
    - "| `AppMain` |"

absent:
  module-graph:
    - "| `App` | `App.xcodeproj` |"
  api-surface:
    - "`App (App.xcodeproj)`"

omissions:
  - path: project.yml
    reason: absent
    kind: missing-input
